name: build_switch

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        preset: [switch]
    runs-on: ${{ matrix.os }}
    container: devkitpro/devkita64:latest

    steps:
    - uses: actions/checkout@v3

    # fetch latest cmake
    - uses: lukka/get-cmake@latest

    - name: Configure CMake
      # disable ftp-gc until dkpa64 container uses latest libnx
      run: |
        cmake --preset ${{ matrix.preset }} -DUSE_VFS_GC=0

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} --parallel 4

    # 스위치용 sysmodule을 SD 카드에 바로 덮어쓸 수 있는 모양으로 묶어 올림
    - name: Package sysmodule
      run: |
        mkdir -p out/atmosphere/contents out/config/ftpsrv
        cp -r build/switch/420000000000011B out/atmosphere/contents/
        cp assets/config.ini.template out/config/ftpsrv/

    - uses: actions/upload-artifact@v4
      with:
        name: ftpsrv-sysmod-savefix
        path: out
